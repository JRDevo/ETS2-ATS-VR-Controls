# ETS2 ATS VR Controls -- settings. Read when the game starts (restart the game after a change).
# Lines are  key = value . A line that starts with # is a comment.

# 1 = on, 0 = off (the layer then does nothing at all)
enabled = 1

# The games it works in (exe file names, comma separated). * = every OpenXR game. In every other program the layer does nothing.
apps = eurotrucks2.exe, amtrucks.exe

# ---- buttons -> keys / mouse --------------------------------------------------------------------------------------------------
# Button names:  ltrigger rtrigger lgrip rgrip  x y a b  lstick rstick (stick click)  menu (left)
#                lup ldown lleft lright  rup rdown rleft rright (stick pushed that way)
# Values:  a key name, up to 3 keys with + (shift+f), mouse_left, mouse_right, mouse_middle, wheel_up, wheel_down, none
# Key names:  a..z  0..9  f1..f12  space enter esc tab backspace  up down left right  insert delete home end pageup pagedown
#             shift rshift ctrl rctrl alt ralt capslock  num0..num9 numdot numplus numminus nummul numdiv numenter
#             [ ] ; ' , . / \ - = `
# Keys are sent as the physical key (scan code): "[" is the key right of P, on any keyboard layout.
# The game itself uses the trigger and its menu button (its own VR controls). The trigger is shared: the game's action AND the
# key here. The game's menu button is left to the game, so a key here does nothing on it: "menu" on every controller, B and Y
# on Valve Index, B (the right menu) on Vive / Windows MR. The log warns about such a button.
# If one trigger pull in the game's VR menus clicks twice (the game's own click + this mouse click), set rtrigger = none.
rtrigger = mouse_left
ltrigger = mouse_right
a = enter
b = esc
x = [
y = ]
rstick = h
lstick = f
menu = none
rup = up
rdown = down
rleft = left
rright = right

# ---- mouse ------------------------------------------------------------------------------------------------------------------
# The stick that moves the mouse pointer: left, right or off. That stick's directions above are then not used.
mouse_stick = left
# Pointer speed at full stick, in pixels per second.
mouse_speed = 900
# How far the stick must move before the pointer moves (0 .. 0.9).
deadzone = 0.15

# Air mouse: hold this button and turn the controller to move the pointer (like a laser pointer). off = no air mouse.
air_mouse = rgrip
# hold = the air mouse works while the button is held; toggle = one press switches it on, the next press off.
air_mode = hold
# Pointer pixels per degree of controller turn.
air_speed = 25

# ---- VR menu + keyboard (in the headset) --------------------------------------------------------------------------------------
# Hold ALL menu_combo buttons (2 to 4, joined with +) for menu_hold seconds: this mod's own menu opens in front of you (and
# closes the same way). Hold the grips first, then click the stick (the stick alone is still the hazard lights). Not both stick
# clicks: VR EyeCapture records on that. It uses no keyboard key, so it never meets the DLAA mod's menu (Delete). Point with
# either controller and pull its trigger. The menu sets every button, the mouse and the keyboard; it writes its changes into
# this file at once. 0 = no menu.
vr_menu = 1
menu_combo = lgrip+rgrip+lstick
menu_hold = 1.0
# The menu's colours: dark, blue, grey, light, black or green. How solid each panel is: 0.2 (very see-through) .. 1 (solid).
theme = dark
menu_opacity = 0.95
keyboard_opacity = 0.95
# 1 = the keyboard is shown (it stays when the menu closes, and comes back at the next game start); its x hides it.
keyboard_show = 0
# full = the whole keyboard (arrows, number pad); compact = the main keys only (Esc / F-keys down to Enter), narrower.
keyboard_layout = full
# Calms a shaky hand: the menu pointer and the air mouse. off, low, medium or high (smoother, a little slower to follow).
pointer_smoothing = medium
# Where the panels float, written by the menu when you move or resize one: x, y, z (metres), turn, tilt (degrees), width
# (metres), in the room as it was at the last recenter. Delete the line: the panel opens in front of you again.

# ---- log --------------------------------------------------------------------------------------------------------------------
# 1 = every key / mouse button the layer sends is written to logs\ets2_ats_vr_controls.log (to check a mapping).
log_inputs = 0
