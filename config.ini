# ETS2 ATS VR Controls -- settings. Read when the game starts (restart the game after a change).
# Lines are  key = value . A line that starts with # is a comment.

# 1 = on, 0 = off (the layer then does nothing at all)
enabled = 1

# The games it works in (exe file names, comma separated). * = every OpenXR game. In every other program the layer does nothing.
apps = eurotrucks2.exe, amtrucks.exe

# ---- buttons -> keys / mouse --------------------------------------------------------------------------------------------------
# Button names:  ltrigger rtrigger lgrip rgrip  x y a b  lstick rstick (stick click)  menu (left)
#                lup ldown lleft lright  rup rdown rleft rright (stick pushed that way)
# Values:  a key name, up to 3 keys with + (shift+f), mouse_left, mouse_right, mouse_middle, wheel_up, wheel_down,
#          gas, brake (driving, see below), keyboard (shows / hides the VR keyboard), none
# Key names:  a..z  0..9  f1..f12  space enter esc tab backspace  up down left right  insert delete home end pageup pagedown
#             shift rshift ctrl rctrl alt ralt capslock  num0..num9 numdot numplus numminus nummul numdiv numenter
#             printscreen scrolllock pause
#             [ ] ; ' , . / \ - = `
# Keys are sent as the physical key (scan code): "[" is the key right of P, on any keyboard layout.
# The game itself uses the trigger and its menu button (its own VR controls). The trigger is shared: the game's action AND the
# key here. The game's menu button is left to the game, so a key here does nothing on it: "menu" on every controller, B and Y
# on Valve Index, B (the right menu) on Vive / Windows MR. The log warns about such a button.
# A trigger with a mouse click here: if one pull in the game's VR menus clicks twice (the game's own click + this
# click), set it to none.
rtrigger = gas
ltrigger = brake
a = mouse_left
b = esc
x = [
y = ]
rstick = h
lstick = f
menu = none
rup = up
rdown = down
rleft = left
rright = right

# ---- mouse ------------------------------------------------------------------------------------------------------------------
# The stick that moves the mouse pointer: left, right or off. That stick's directions above are then not used.
mouse_stick = right
# Pointer speed at full stick, in pixels per second.
mouse_speed = 1800
# How far the stick must move before the pointer moves (0 .. 0.9).
deadzone = 0.15

# ---- modifier ---------------------------------------------------------------------------------------------------------------
# While the modifier button is held, a button listed in modifier_keys sends that instead (the others as normal). The modifier
# keeps its own job (the right grip stays the air mouse). Default: right grip + A or right trigger = left click, right grip +
# B = right click, so ONE controller moves the pointer (air mouse) and does both clicks (the map: hold the grip, aim, hold B
# to drag). The right trigger alone is the gas.
# modifier: a button name, or off. modifier_keys: button:key pairs joined with | , e.g.  rtrigger:mouse_right | a:f1  (none = no pairs).
# A SECOND modifier (modifier2, default lgrip) gives two more layers: modifier2 held = modifier2_keys, BOTH held =
# modifier_both_keys (four layers in all: none, modifier, modifier2, both). Hold the modifier(s) first, then the button. An
# empty entry = the button's normal job. Not the same button twice, never both stick clicks (VR EyeCapture records on them).
modifier = rgrip
modifier_keys = a:mouse_left | b:mouse_right | rtrigger:mouse_left
modifier2 = lgrip
modifier2_keys = none
modifier_both_keys = none

# Air mouse: hold this button and turn the controller to move the pointer (like a laser pointer). off = no air mouse.
air_mouse = rgrip
# hold = the air mouse works while the button is held; toggle = one press switches it on, the next press off.
air_mode = hold
# Pointer pixels per degree of controller turn.
air_speed = 25

# ---- driving -----------------------------------------------------------------------------------------------------------------
# Smooth driving, not keys: the mod is also the game's own input add-on (scripts\install.ps1 registers it), so nothing needs to
# be set in the game's options. The game still loads it when nothing here drives; uninstall.ps1 removes it completely.
# GAS and BRAKE: give any button the value  gas  or  brake  above (or in modifier_keys, e.g. rtrigger:brake). Triggers and
# grips are analog (press harder = more), a stick direction too (lup = gas), any other button is full on. A trigger below 5 %
# counts as let go. Default: rtrigger = gas, ltrigger = brake (and right grip + right trigger = left click: modifier).
# 1 = driving on; 0 = off: no steering, the gas / brake buttons do nothing, the steering stick's left / right are keys again.
drive = 1
# The stick that steers: left, right or off. Its left / right above are then not used (up / down still are), and the mouse
# is off on that stick.
steer = left
# What steers: stick (the stick above), wheel (hold BOTH grips and turn your hands like a steering wheel: left hand up = a
# right turn; let go = straight) or point (point a controller left / right; straight ahead = straight; the wheel
# holds where it is while you point at the VR menu / keyboard or use the air mouse). The stick can steer too (below).
steer_with = stick
# wheel: degrees of hand turn to full lock (10 .. 180). point: degrees left / right to full lock (10 .. 90).
steer_wheel_angle = 90
steer_point_angle = 35
# wheel / point: 1 = the stick steers too (pushed, it wins); 0 = only the hands, the stick's left / right are buttons again.
steer_stick_too = 1
# wheel: the grips that hold it -- both (together; one grip alone keeps its own job), left, right or either (one hand is
# enough: move it round the rim). A grip that holds the wheel is only the wheel (no key, modifier, air mouse, gas / brake).
steer_wheel_grip = both
# point: the hand that points (left or right). The other hand stays free for the VR keyboard and menu.
steer_point_hand = right
# How the wheel moves: the stick's place is where the wheel goes (stick half left = wheel half left). While you hold the
# stick, the wheel glides there (a small push turns it slowly, a full push fast); ease the stick and the wheel comes back to
# the new place and stays. Let go: the wheel goes back to straight.
# Smoothing while the stick is held: seconds (0 .. 2; 0 = none). More = smoother and calmer, less = quicker. Calmer at speed
# by itself (at 90 km/h with steer_at_speed 0.30: about 1.8 times as long).
steer_follow_time = 0.40
# Let go: back to straight. 0 = at once, at the wheel speed below (the default); more = a slow glide, in seconds (0 .. 10).
# A thumb that slips past the middle as it lets go only brings the wheel to straight, never past it.
steer_center_time = 0.00
# The fastest the wheel turns: full turns (straight to full lock) per second (0 .. 10; 0 = no limit), with the stick pushed
# all the way; a small push turns it slower. 0.5 = 2 s from straight to full lock. Slower at speed too (as above).
steer_max_speed = 0.50
# Speed-sensitive steering (the speed comes from the game): 1 = on, 0 = off. On: up to 10 km/h the stick steers fully; at
# 90 km/h and faster full stick turns the wheel only steer_at_speed of that (0.1 .. 1). A bend you hold while you speed up
# stays; ease the stick and the wheel comes into the smaller range.
steer_speed_sens = 1
steer_at_speed = 0.30
# How far the stick must move before the wheel turns (0 .. 0.5).
steer_deadzone = 0.10
# Small and hard turns: the stick's throw is short, so it has two zones. The first steer_fine_zone of a push (0.5 .. 0.95;
# 0.80 = 80 %) makes small, careful turns (following the road), up to steer_fine of the wheel (0.05 .. 0.95; 0.20 = 20 %).
# The rest, up to the edge, turns the wheel on up to full lock (hard turns). steer_fine = steer_fine_zone: even all the way.
steer_fine = 0.20
steer_fine_zone = 0.80
# The stick counts as pushed all the way from here on (0.7 .. 1): many sticks (and thumbs) stop at about 0.93 - 0.95.
steer_full_at = 0.95
# How far full stick turns the wheel (0.2 .. 1; 1 = full lock).
steer_max = 1.00

# ---- VR menu + keyboard (in the headset) --------------------------------------------------------------------------------------
# Hold ALL menu_combo buttons (2 to 4, joined with +) for menu_hold seconds: this mod's own menu opens in front of you (and
# closes the same way). Hold the grips first, then click the stick (the stick alone is still the hazard lights). Not both stick
# clicks: VR EyeCapture records on that. It uses no keyboard key, so it never meets the DLAA mod's menu (Delete). Point with
# either controller and pull its trigger. The menu sets every button, the mouse and the keyboard; it writes its changes into
# this file at once. 0 = no menu.
vr_menu = 1
menu_combo = lgrip+rgrip+lstick
menu_hold = 1.0
# The menu's colours: dark, blue, grey, light, black or green. How solid each panel is: 0.2 (very see-through) .. 1 (solid).
theme = dark
menu_opacity = 0.95
keyboard_opacity = 0.95
# 1 = the keyboard is shown (it stays when the menu closes, and comes back at the next game start); its x hides it.
keyboard_show = 0
# full = the whole keyboard (arrows, number pad); compact = the main keys only (Esc / F-keys down to Enter), narrower.
keyboard_layout = full
# Calms a shaky hand: the menu pointer and the air mouse. off, low, medium or high (smoother, a little slower to follow).
pointer_smoothing = medium
# The menu's language: auto (the language the game is set to) or a game language code: en_us, de_de, fr_fr, ru_ru, ja_jp ...
# (all codes: lang\README.md). The VR keyboard's letters: auto (as the menu) or a code -- e.g. de_de = a German keyboard
# (QWERTZ, Ü Ö Ä) under an English menu. Each key still presses the same key in the game.
language = auto
keyboard_language = auto
# Where the panels float, written by the menu when you move or resize one: x, y, z (metres), turn, tilt (degrees), width
# (metres), in the room as it was at the last recenter. Delete the line: the panel opens in front of you again.

# ---- log --------------------------------------------------------------------------------------------------------------------
# 0 = no log file (the default: the lightest). 1 = write logs\ets2_ats_vr_controls.log next to the DLL -- for a bug report: set
# 1, play until the problem shows, quit, and attach that file (it also shows the mod's own cost: "performance:" lines).
log = 0
# 1 = also every key / mouse button the layer sends (with log = 1; to check a mapping).
log_inputs = 0
